<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Živé výsledky</title>
  <link rel="stylesheet" href="/static/present.css">
</head>
<body>
  <header class="bar">
    <h1 id="title">Načítavam…</h1>
    <div class="bar-right">
      <span class="count survey-count"><b id="submitted">0</b> odovzdaných</span>
      <span class="count survey-count"><b id="inProgress">0</b> vypĺňa</span>
      <span class="count" id="playersCount" hidden><b>0</b> hráčov</span>
      <span id="status" class="pill"></span>
    </div>
  </header>

  <main id="slides"></main>

  <footer class="foot">
    <span id="conn" class="conn" hidden>Spojenie prerušené – obnovujem…</span>
    <span id="position"></span>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <div id="keytest" class="keytest" hidden>
    <h2>Test prezentéra</h2>
    <p>Stláčaj tlačidlá na prezentéri. Zobrazí sa, akú klávesu posielajú. (Zavri klávesou <kbd>K</kbd>.)</p>
    <ol id="keylog"></ol>
  </div>

  <template id="tpl-intro">
    <section class="slide intro">
      <div class="step wifi-step" hidden>
        <div class="qr big" data-wifi-qr></div>
        <div class="intro-text">
          <p class="eyebrow">1. Nemáš internet? Pripoj sa na Wi-Fi</p>
          <p class="url" data-wifi-ssid></p>
          <p class="hint">Sieť bez hesla</p>
        </div>
      </div>
      <div class="step">
        <div class="qr big" data-qr></div>
        <div class="intro-text">
          <p class="eyebrow" data-fill-title>Naskenuj QR kód a odpovedaj</p>
          <p class="url" data-url></p>
          <p class="hint" data-hint>Výsledky sa tu zobrazujú naživo.</p>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-chart">
    <section class="slide question">
      <h2 class="q-text"></h2>
      <div class="q-body">
        <div class="chart-wrap">
          <canvas></canvas>
          <p class="empty" hidden>Zatiaľ žiadne odpovede</p>
        </div>
        <ul class="legend"></ul>
      </div>
      <p class="legend-note">Plná farba = odovzdané · svetlá = ešte vypĺňajú</p>
      <div class="corner-qr"><div class="qr" data-qr></div><span data-url></span></div>
    </section>
  </template>

  <template id="tpl-text">
    <section class="slide question">
      <h2 class="q-text"></h2>
      <p class="empty" hidden>Zatiaľ žiadne odpovede</p>
      <ul class="wall"></ul>
      <div class="corner-qr"><div class="qr" data-qr></div><span data-url></span></div>
    </section>
  </template>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/quiz-shapes.js"></script>
  <script src="/static/present.js"></script>
</body>
</html>
